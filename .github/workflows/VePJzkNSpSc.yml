                core.info(`COMMIT_OK attempt=${hND0} sha=${VETA.commit.sha} msg=${wEKT}`);
                return;
              } catch (Gb) {
                zFtr = Gb;
                if (Gb.status === 409 && hND0 < 4) {
                  core.warning(`Conflict on attempt ${hND0}, retrying...`);
                  await new Promise((r) => setTimeout(r, 1500 * hND0));
                  continue;
